<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <script>
    // This file was renamed to index.html. Forward old links, preserving the
    // ?org= query and #gist=…&token=… hash so existing share links keep working.
    location.replace('index.html' + location.search + location.hash);
  </script>
</head>
<body style="font-family:system-ui,sans-serif;padding:2rem;color:#0F2544">
  Redirecting to the timeline… <a id="go" href="index.html">continue</a>
  <script>document.getElementById('go').href = 'index.html' + location.search + location.hash;</script>
</body>
</html>
